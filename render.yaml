# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Monorepo: build from repo root with COPY backend/

services:
  - type: web
    name: omniva-restaurant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "80"
      - key: APP_NAME
        value: Betedesta
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://omniva-restaurant.onrender.com
      - key: FRONTEND_URL
        value: https://omniva.evella.et
      - key: CORS_ALLOWED_ORIGINS
        value: https://omniva.evella.et
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_SEEDERS
        value: "false"
