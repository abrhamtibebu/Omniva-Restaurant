server {
    # Render terminates TLS; container listens on HTTP.
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    sendfile off;
    error_log /dev/stdout info;
    access_log /dev/stdout;

    charset utf-8;

    # Answer preflight here so the browser is not blocked when PHP 500s.
    # Real responses get CORS from Laravel config/cors.php (do not duplicate).
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://omniva.evella.et" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Branch-Id, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Content-Length 0 always;
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
